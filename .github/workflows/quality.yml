name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Check lockfile hosts
        run: node scripts/check-lockfile.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test packages
        run: pnpm test
      - name: Check package exports and size
        run: pnpm check:packages
      - name: Check content snapshots
        run: pnpm check:content
      - name: Test content
        run: pnpm test:content
      - name: Build site
        run: pnpm build
      - name: Check titles, descriptions, and OG images
        run: |
          pnpm start --port 3100 &
          for _ in $(seq 30); do
            curl --fail --silent --output /dev/null http://localhost:3100/robots.txt && break
            sleep 1
          done
          pnpm check:seo http://localhost:3100
