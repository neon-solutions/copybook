name: Copybook report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: Comment on changed snippets and prompts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Test changed definitions
        working-directory: examples/acme
        run: pnpm exec copybook test --changed --base "origin/${{ github.base_ref }}" || true
      - name: Build the report
        working-directory: examples/acme
        run: pnpm --silent exec copybook report --base "origin/${{ github.base_ref }}" > "$RUNNER_TEMP/report.md"
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Update the earlier report comment instead of adding a new one.
          comment_id="$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- copybook-report -->"))][0].id // empty')"
          if test "$comment_id" != ""; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -F body=@"$RUNNER_TEMP/report.md"
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/report.md"
          fi
